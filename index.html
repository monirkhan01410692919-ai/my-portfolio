    <p>আমি নতুন ওয়েব ডেভেলপার হিসেবে শিখছি।</p>

    <div class="skills">
        <h3>আমার দক্ষতা:</h3>
        <p>HTML, CSS</p>
    </div>

    <div class="contact">
        <h3>যোগাযোগ:</h3>
        <p>ইমেইল: example@email.com</p>
    </div>
</div>

</body>
</html>
